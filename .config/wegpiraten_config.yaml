structure:
  prj_root: /home/stephan/projects/wegpiraten
  shared_data_path: data
  output_path: output
  template_path: templates
  tmp_path: .tmp
  log_path: .logs
  local_data_path: data
  imports_path: import
  done_path: done
  graphics: graphics

database:
  sqlite_db_name: wegpiraten.sqlite3
  db_name: wegpiraten_datenbank.xlsx
  # db password in .env

# Quelle der Stammdaten-Datei auf Proton Drive (Zugriff nur via proton-drive
# CLI, kein Mount). Der Lock serialisiert gegen die Sync-Timer (SQLITE_BUSY),
# vgl. ~/proton-drive/Makefile.
masterdata_source:
  remote_dir: "/my-files/Shared/Beatus/Wegpiraten Unterlagen"
  # Nur die exakte Datei ist relevant; ähnlich benannte Sicherungs- oder
  # Lookup-Versionen (z.B. wegpiraten_datenbank_ohne_Accordix.xlsx) dürfen
  # niemals als Stammdatenquelle gewählt werden.
  file_pattern: "wegpiraten_datenbank.xlsx"
  preferred_filename: wegpiraten_datenbank.xlsx
  proton_cli: "~/.local/bin/proton-drive"
  lockfile: "~/proton-drive/.proton.lock"
  lock_timeout_seconds: 1800

logging:
  log_file: wegpiraten.log
  log_level: DEBUG

templates:
  invoice_template_name: rechnungsvorlage.docx
  sheet_name: Pivot Rechnungsdaten # deprecated, use sqlite table name
  # TODO: Felder des Invoice Templates noch in Config aufnehmen

  time_sheet_header_cells:
    employee_name: C5
    emp_id: f5
    reporting_month: C6
    allowed_hours_per_month: C7
    service_type: F7
    short_code: C8
    client_id: F8
    budget_travel_time: C30
    budget_direct_effort: D30
    budget_indirect_effort: E30
  time_sheet_data_start_cell: A10
  time_sheet_data_end_cell: h28
  time_sheet_row_mapping:
    service_time: A
    service_date: B
    travel_time: C
    # travel_distance: D
    direct_time: D
    indirect_time: E
    # billable_hours: G # Summe aus travel_time, direct_time, indirect_time, information only
    notes: h

  time_sheet_template: time_sheet_template.xlsx
  client_sheet_name: MD_Klienten # deprecated, use sqlite table name
  # sheet password in .env

# Globale Formatierungseinstellungen für Babel/Jinja2-Filte
formatting:
  locale: de_CH
  currency: CHF
  currency_format: "#,##0.00 ¤"
  date_format: "dd.MM.yyyy"
  numeric_format: "#,##0.00"

service_provider:
  name: Wegpiraten GmbH
  street: Hauptstrasse 47
  zip_code: '3800'
  city: Unterseen
  phone: +41 (0)76 790 67 56
  email: info@wegpiraten.ch
  website: www.wegpiraten.ch
  uid: CHE-123.456.789 MWST
  bank: Bank EKI Genossenschaft
  iban: CH07 0839 3053 8385 3915 1


entities:
  employee:
    fields:
      - name: emp_id
        type: str
        primary_key: true
        excel_column: employee_id
      - name: first_name
        type: str
        excel_column: first_name
      - name: last_name
        type: str
        excel_column: last_name
      - name: fte
        type: float
        excel_column: fte
        format: ${numeric_format}
      - name: ts
        type: bool
        excel_column: TS
        optional: true
      - name: notes
        type: str
        excel_column: notes
        optional: true

  tenant:
    fields:
      - name: tenant_id
        type: str
        primary_key: true
        excel_column: tenant_id
      - name: name
        type: str
        excel_column: name
      - name: tenant_street
        type: str
        excel_column: tenant_street
      - name: tenant_zip
        type: str
        excel_column: tenant_zip
      - name: tenant_city
        type: str
        excel_column: tenant_city
      - name: tenant_iban
        type: str
        excel_column: tenant_iban

  client:
    fields:
      - name: client_id
        type: str
        primary_key: true
        excel_column: client_id
      - name: social_security_number
        type: str
        excel_column: social_security_number
      - name: first_name
        type: str
        excel_column: first_name
      - name: last_name
        type: str
        excel_column: last_name
      - name: short_code
        type: str
        excel_column: short_code
      - name: sr_ap_first_name
        type: str
        optional: true
        excel_column: sr_ap_first_name
      - name: sr_ap_last_name
        type: str
        optional: true
        excel_column: sr_ap_last_name
      - name: sr_ap_gender
        type: str
        optional: true
        excel_column: sr_ap_gender
      - name: tenant_id
        type: str
        excel_column: tenant_id
      - name: payer_id
        type: str
        excel_column: payer_id
      - name: service_requester_id
        type: str
        excel_column: service_requester_id
      - name: start_date
        type: str
        excel_column: start_date
        format: ${date_format}
      - name: end_date
        type: str
        excel_column: end_date
        format: ${date_format}
        optional: true
      - name: allowed_travel_time
        type: int
        optional: true
        excel_column: allowed_travel_time
        multiply_by: 60
      - name: allowed_direct_effort
        type: int
        optional: true
        excel_column: allowed_direct_effort
        multiply_by: 60
      - name: allowed_indirect_effort
        type: int
        optional: true
        excel_column: allowed_indirect_effort
        multiply_by: 60
      - name: service_type
        type: str
        excel_column: service_type_id
      - name: notes
        type: str
        excel_column: notes
        optional: true
      - name: application_number
        type: str
        optional: true
        excel_column: application_number
      # Accordix-Felder (KFSG-Leistungsmeldung). Alle optional, damit der
      # Import auch für nicht meldepflichtige Klienten funktioniert;
      # die Vollständigkeit wird bei der Accordix-Meldung geprüft.
      - name: date_of_birth
        type: str
        optional: true
        excel_column: date_of_birth
        format: ${date_format}
      - name: gender # m / w / d
        type: str
        optional: true
        excel_column: gender
      - name: uma_umf # Ja / Nein / Unbekannt
        type: str
        optional: true
        excel_column: uma_umf
      - name: spoken_language # DE / FR (nur bei bilingualen LE)
        type: str
        optional: true
        excel_column: spoken_language
      - name: canton_of_residence # Kantonskürzel oder Ausland
        type: str
        optional: true
        excel_column: canton_of_residence
      - name: residence_legal_guardian # PLZ/Gemeinde, nur wenn Wohnkanton BE
        type: str
        optional: true
        excel_column: residence_legal_guardian
      - name: allocation # Zuweisung gemäss Accordix-Werteliste
        type: str
        optional: true
        excel_column: allocation
      # Weitere Accordix-Felder (für vollständige Meldedatei)
      - name: is_consultative_adolescent_psychiatric_care # IBF: Konsiliarische jugendpsychiatrische Versorgung
        type: bool
        optional: true
        excel_column: is_consultative_adolescent_psychiatric_care
      - name: number_of_care_days_per_week # SPT: Anzahl Betreuungstage pro Woche (3-5)
        type: int
        optional: true
        excel_column: number_of_care_days_per_week
      - name: is_leaving_reason_planned # War der Austritt geplant?
        type: bool
        optional: true
        excel_column: is_leaving_reason_planned
      - name: leaving_reason # Austrittsgrund
        type: str
        optional: true
        excel_column: leaving_reason
      - name: custom_leaving_reason # Anderer Austrittsgrund (Freitext)
        type: str
        optional: true
        excel_column: custom_leaving_reason
      - name: after_leave_situation # Situation nach Austritt
        type: str
        optional: true
        excel_column: after_leave_situation
      - name: custom_after_leave_situation # Andere Situation nach Austritt (Freitext)
        type: str
        optional: true
        excel_column: custom_after_leave_situation
      - name: remarks # Bemerkungen
        type: str
        optional: true
        excel_column: remarks

  # Relation Klient <-> Mitarbeiter (ersetzt die ehemaligen Spalten
  # employee_id/employee_2 in der Klienten-Tabelle). Diese Spalten dienen in
  # der Excel-Datei nur noch der Ansicht und dürfen im Code nicht mehr
  # verwendet werden.
  client_employee_relation:
    fields:
      - name: client_id
        type: str
        primary_key: true
        excel_column: client_id
      - name: employee_id
        type: str
        primary_key: true
        excel_column: employee_id

  payer:
    fields:
      - name: payer_id
        type: str
        primary_key: true
        excel_column: payer_id
      - name: name
        type: str
        excel_column: name
      - name: name2
        type: str
        optional: true
        excel_column: name2
      - name: street
        type: str
        excel_column: street
      - name: zip_code
        type: str
        excel_column: zip_code
      - name: city
        type: str
        excel_column: city
      - name: notes
        type: str
        excel_column: notes
        optional: true

  service_requester:
    fields:
      - name: service_requester_id
        type: str
        primary_key: true
        excel_column: service_requester_id
      - name: name
        type: str
        excel_column: name

  service_type:
    fields:
      - name: service_type_id
        type: str
        primary_key: true
        excel_column: service_type_id
      - name: code
        type: str
        excel_column: code
      - name: description
        type: str
        excel_column: description
        optional: true
      - name: hourly_rate
        type: float
        excel_column: hourly_rate
        format: ${numeric_format}
      - name: km_rate
        type: float
        excel_column: km_rate
        format: ${numeric_format}
      - name: rundung
        type: float
        excel_column: rundung
        format: ${numeric_format}
      - name: from_date
        type: str
        excel_column: from_date
        format: ${date_format}
        optional: true
      - name: to_date
        type: str
        excel_column: to_date
        format: ${date_format}
        optional: true
      - name: notes
        type: str
        excel_column: notes
        optional: true

  invoice_data:
    fields:
      - name: invoice_number
        type: str
        primary_key: true
        excel_column: Rechnungs-Nr
      - name: client_id
        type: str
        excel_column: Klient-Nr.
      - name: service_time
        type: str
        excel_column: Uhrzeit
        format: ${date_format} - ${date_format}
      - name: service_date
        type: str
        excel_column: Leistungsdatum
        format: ${date_format}
        is_position: true
      - name: service_type
        type: str
        excel_column: Betreuungstyp
      - name: travel_time
        type: float
        excel_column: Fahrtzeit
        format: ${numeric_format}
        decimals: 2
        is_position: true
        sum: true
      - name: direct_time
        type: float
        excel_column: Direkt
        format: ${numeric_format}
        decimals: 2
        is_position: true
        sum: true
      - name: indirect_time
        type: float
        excel_column: Indirekt
        format: ${numeric_format}
        decimals: 2
        is_position: true
        sum: true
      # - name: billable_hours
      #   type: float
      #   excel_column: Sollstunden
      #   format: ${numeric_format}
      #   decimals: 2
      #   is_position: true
      #   sum: true
      # - name: hourly_rate
      #   type: currency
      #   excel_column: Stundensatz
      #   format: ${currency_format}
